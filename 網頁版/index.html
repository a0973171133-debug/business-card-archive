<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17212b">
  <title>名片自動歸檔｜聯絡人資料庫</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--ink:#17212b;--muted:#68737d;--line:#e5e9ec;--soft:#f6f8f9;--white:#fff;--architect:#315f7a;--owner:#8b5e34;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .shell{width:min(1320px,calc(100% - 32px));margin:auto;padding:26px 0 64px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:16px 0 24px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted)}h1{margin:5px 0 0;font-size:clamp(27px,4vw,46px);letter-spacing:-.04em;line-height:1.15}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700}.btn:hover{border-color:#9ea8af}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.small{font-size:12px;padding:7px 10px}.btn input{display:none}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:22px 0 18px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:#fff}.intro p{margin:0;color:var(--muted);font-size:13px}.intro strong{display:block;color:var(--ink);font-size:15px}.status{font-size:12px;white-space:nowrap;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:28px;line-height:1.2}.stat span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}.search{flex:1;position:relative}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 14px 0 40px;background:#fff;outline:none}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#8796a2;box-shadow:0 0 0 3px #17212b12}.search:before{content:"⌕";position:absolute;left:15px;top:6px;font-size:23px;color:#8b959c}.toolbar select{height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 12px;color:var(--ink)}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;transition:.18s ease}.card:hover{border-color:#aab3b9;box-shadow:0 8px 22px #17212b0b}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:20px;font-weight:900;line-height:1.3}.company{margin-top:3px;color:#4c5962;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800}.badge.architect{color:var(--architect);background:#e8f1f5}.badge.owner{color:var(--owner);background:#f5eee8}.position{margin:14px 0 13px;color:var(--muted);font-size:13px}.contact{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:13px;font-size:12px}.contact div{display:flex;gap:8px}.contact b{width:44px;color:#89939a;font-size:11px;flex:0 0 auto}.contact span{overflow-wrap:anywhere}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.date{color:#9aa3a9;font-size:11px}.empty{grid-column:1/-1;padding:48px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfd7dc;border-radius:12px}
    dialog{width:min(660px,calc(100% - 24px));border:0;border-radius:14px;padding:0;box-shadow:0 22px 80px #17212b30}dialog::backdrop{background:#17212b80}.modal{padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.modal h2{margin:0;font-size:26px}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:12px;background:var(--soft);border-radius:8px}.detail label{display:block;color:#89939a;font-size:11px;margin-bottom:2px}.detail div{font-size:14px;overflow-wrap:anywhere}.modal-note{margin-top:12px;color:var(--muted);font-size:12px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.photo-preview{width:100%;max-height:230px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#f6f7f8;margin-bottom:16px}
    form .field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 11px;outline:none}.field textarea{min-height:76px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .footnote{margin-top:22px;color:#89939a;font-size:12px}.footnote code{background:#e9edef;padding:2px 5px;border-radius:4px}
    @media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{width:min(100% - 20px,620px);padding-top:12px}.top,.intro{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.toolbar{align-items:stretch;flex-direction:column}.cards{grid-template-columns:1fr}.detail-grid,.form-grid{grid-template-columns:1fr}.intro .status{white-space:normal}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">BUSINESS CARD ARCHIVE</div><h1>名片自動歸檔</h1></div>
      <div class="top-actions"><button class="btn" id="importBtn">匯入資料庫 JSON</button><button class="btn" id="exportBtn">匯出 JSON</button><button class="btn" id="csvBtn">匯出 CSV</button><button class="btn primary" id="addBtn">＋ 新增名片</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div>
    </header>
    <section class="intro"><div><strong>建築師／業主聯絡人資料庫</strong><p>支援搜尋、分類、名片資料檢視、JSON 匯入與 CSV 匯出。資料會先儲存在本機瀏覽器。</p></div><div class="status" id="status">資料來源：名片資料庫.json</div></section>
    <section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>全部名片</span></div><div class="stat"><strong id="architectCount">0</strong><span>建築師類</span></div><div class="stat"><strong id="ownerCount">0</strong><span>業主類</span></div><div class="stat"><strong id="pendingCount">0</strong><span>待查姓名</span></div></section>
    <section class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜尋姓名、公司、職位、電話或 Email…"></div><select id="category"><option value="全部">全部分類</option><option value="建築師">建築師</option><option value="業主">業主</option></select><select id="sort"><option value="date-desc">日期：新到舊</option><option value="date-asc">日期：舊到新</option><option value="name">姓名排序</option><option value="company">公司排序</option></select></section>
    <section class="cards" id="cards"></section>
    <p class="footnote">提醒：網頁版無法直接搬移電腦檔案。照片實體歸檔仍使用專案內的 <code>名片自動歸檔.mjs</code>；本頁新增或修改的資料可用「匯出 JSON」交給歸檔程序。</p>
  </main>

  <dialog id="detailDialog"><div class="modal"><div class="modal-head"><div><div class="eyebrow">CONTACT RECORD</div><h2 id="detailName"></h2></div><button class="close" data-close="detailDialog">×</button></div><img id="detailPhoto" class="photo-preview" alt="名片照片預覽" hidden><div class="detail-grid" id="detailGrid"></div><div class="modal-note" id="detailNotes"></div><div class="modal-actions"><button class="btn" id="detailEdit">編輯資料</button><button class="btn primary" data-close="detailDialog">關閉</button></div></div></dialog>
  <dialog id="formDialog"><form class="modal" id="cardForm"><div class="modal-head"><div><div class="eyebrow">CARD RECORD</div><h2 id="formTitle">新增名片</h2></div><button type="button" class="close" data-close="formDialog">×</button></div><input id="editSource" type="hidden"><div class="form-grid"><div class="field"><label for="fCategory">分類</label><select id="fCategory"><option>建築師</option><option>業主</option></select></div><div class="field"><label for="fDate">日期</label><input id="fDate" type="date"></div></div><div class="form-grid"><div class="field"><label for="fName">姓名</label><input id="fName" required></div><div class="field"><label for="fPosition">職位</label><input id="fPosition"></div></div><div class="field"><label for="fCompany">公司／事務所</label><input id="fCompany" required></div><div class="form-grid"><div class="field"><label for="fPhone">電話</label><input id="fPhone"></div><div class="field"><label for="fFax">傳真</label><input id="fFax"></div></div><div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email"></div><div class="field"><label for="fNotes">備註</label><textarea id="fNotes"></textarea></div><div class="form-actions"><button type="button" class="btn" data-close="formDialog">取消</button><button type="submit" class="btn primary">儲存資料</button></div></form></dialog>
  <script src="card-data.js"></script>
  <script>
    (()=>{
      const $=id=>document.getElementById(id);const storageKey='business-card-archive-v1';
      let records=loadRecords(),editingSource=null;
      function loadRecords(){try{const saved=localStorage.getItem(storageKey);if(saved)return JSON.parse(saved).records||[];}catch{}return (window.CARD_DATABASE?.records||[]).map(x=>({...x}));}
      function save(){localStorage.setItem(storageKey,JSON.stringify({records},null,2));$('status').textContent=`資料來源：本機瀏覽器｜最後更新 ${new Date().toLocaleString('zh-TW')}`;}
      function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
      function imagePath(record){return `../照片/${encodeURIComponent(record.category)}/已歸檔/${encodeURIComponent(record.source||'')}`;}
      function render(){const query=$('search').value.trim().toLowerCase(),category=$('category').value,sort=$('sort').value;let view=records.filter(r=>(category==='全部'||r.category===category)&&(!query||Object.values(r).join(' ').toLowerCase().includes(query)));view.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'zh-Hant'):sort==='company'?a.company.localeCompare(b.company,'zh-Hant'):sort==='date-asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));$('totalCount').textContent=records.length;$('architectCount').textContent=records.filter(r=>r.category==='建築師').length;$('ownerCount').textContent=records.filter(r=>r.category==='業主').length;$('pendingCount').textContent=records.filter(r=>r.name==='（待查）'||r.name==='(待查)').length;$('cards').innerHTML=view.length?view.map(card).join(''):'<div class="empty">找不到符合條件的名片資料</div>';document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('click',()=>showDetail(el.dataset.source)));}
      function card(r){const badge=r.category==='建築師'?'architect':'owner';return `<article class="card"><div class="card-head"><div><div class="name">${esc(r.name)}</div><div class="company" title="${esc(r.company)}">${esc(r.company)}</div></div><span class="badge ${badge}">${esc(r.category)}</span></div><div class="position">${esc(r.position||'（職位待查）')}</div><div class="contact"><div><b>電話</b><span>${esc(r.phone||'（待查）')}</span></div><div><b>傳真</b><span>${esc(r.fax||'（待查）')}</span></div><div><b>Email</b><span>${esc(r.email||'（待查）')}</span></div></div><div class="card-foot"><span class="date">${esc(r.date||'日期待查')}</span><button class="btn small" data-source="${esc(r.source)}">檢視資料</button></div></article>`;}
      function showDetail(source){const r=records.find(x=>x.source===source);if(!r)return;$('detailName').textContent=r.name;$('detailGrid').innerHTML=[['分類',r.category],['公司／事務所',r.company],['職位',r.position],['電話',r.phone],['傳真',r.fax],['Email',r.email],['來源照片',r.source],['日期',r.date]].map(([k,v])=>`<div class="detail"><label>${k}</label><div>${esc(v||'（待查）')}</div></div>`).join('');$('detailNotes').textContent=r.notes?`備註：${r.notes}`:'';const photo=$('detailPhoto');photo.src=imagePath(r);photo.hidden=!r.source;photo.onerror=()=>photo.hidden=true;$('detailEdit').onclick=()=>{close('detailDialog');openForm(r)};$('detailDialog').showModal();}
      function openForm(record=null){editingSource=record?.source||null;$('formTitle').textContent=record?'編輯名片':'新增名片';$('editSource').value=record?.source||'';['category','date','name','position','company','phone','fax','email','notes'].forEach(k=>{const id='f'+k[0].toUpperCase()+k.slice(1);$(id).value=record?.[k]||''});$('formDialog').showModal();}
      function close(id){$(id).close();}
      function csv(){const headers=['date','category','name','company','position','phone','fax','email','source','notes'];const quote=v=>`"${String(v??'').replace(/"/g,'""')}"`;const body=[headers,...records.map(r=>headers.map(h=>r[h]))].map(row=>row.map(quote).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='名片資料庫.csv';a.click();URL.revokeObjectURL(a.href);}
      $('search').oninput=render;$('category').onchange=render;$('sort').onchange=render;$('addBtn').onclick=()=>openForm();$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.records))throw new Error();records=data.records;save();render();}catch{alert('匯入失敗：請選擇正確的名片資料庫 JSON。')}e.target.value='';};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='名片資料庫.json';a.click();URL.revokeObjectURL(a.href);};$('csvBtn').onclick=csv;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$('cardForm').onsubmit=e=>{e.preventDefault();const data={source:editingSource||`Web_${Date.now()}.jpg`,date:$('fDate').value||new Date().toISOString().slice(0,10),category:$('fCategory').value,name:$('fName').value.trim(),company:$('fCompany').value.trim(),position:$('fPosition').value.trim(),phone:$('fPhone').value.trim(),fax:$('fFax').value.trim(),email:$('fEmail').value.trim(),notes:$('fNotes').value.trim()};const index=editingSource?records.findIndex(r=>r.source===editingSource):-1;if(index>=0)records[index]=data;else records.unshift(data);save();render();close('formDialog');};render();
    })();
  </script>
</body>
</html>
